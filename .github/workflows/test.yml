name: Test

# Checks the mod the way Claude Code loads it, on every push and pull request:
# `claude plugin validate` reads the manifest and the hooks module,
# `claude plugin test` runs hooks/*.test.tsx. Neither needs an API key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Version
        run: claude --version
      - name: Validate
        run: claude plugin validate plugins/context-pane
      - name: Test
        run: claude plugin test plugins/context-pane
